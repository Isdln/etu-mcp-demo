[project]
name = "pgmon-mcp"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0", "psycopg[binary]>=3.2", "psycopg-pool>=3.2",]

[project.scripts]
pgmon-mcp = "pgmon_mcp.server:main"
pgmon-collector = "pgmon_mcp.collector:main"
pgmon-export = "pgmon_mcp.export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pgmon_mcp"]