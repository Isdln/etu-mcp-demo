[databases]
bench = host=primary port=5432 dbname=bench

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = app
stats_users = app
pool_mode = transaction
default_pool_size = 30
reserve_pool_size = 8
reserve_pool_timeout = 3
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
server_reset_query =